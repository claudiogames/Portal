<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portão 1 CD • Central Operacional</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#111827',
                        bordercol: '#1f2937'
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .app-frame {
            width: 100%;
            height: calc(100vh - 55px);
            border: none;
            display: none;
        }
        .app-frame.active {
            display: block;
        }
        ::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 2px;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-animate {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Animação 3D Estilo App (Flutuação Suave) */
        @keyframes float3D {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-6px) rotate(1deg) scale(1.01); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }
        .animate-float-3d {
            animation: float3D 3s ease-in-out infinite;
        }

        /* Animação de Neve de Fundo */
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 0.8; }
            50% { transform: translateY(50vh) translateX(10px); opacity: 1; }
            100% { transform: translateY(110vh) translateX(-10px); opacity: 0.2; }
        }
        .animate-fall {
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-hidden relative">

    <!-- SPLASH SCREEN RÁPIDA • BOAS FESTAS GRENDENE -->
    <div id="christmas-splash" class="fixed inset-0 bg-[#070a12] z-[999999] flex flex-col items-center justify-center transition-opacity duration-500 overflow-hidden">
        <!-- Flocos de Neve Dinâmicos -->
        <div class="absolute inset-0 pointer-events-none overflow-hidden" id="snow-container"></div>
        
        <!-- Cartão 3D Glassmorphism -->
        <div class="relative flex flex-col items-center z-10 p-6 rounded-3xl bg-slate-900/85 border border-blue-500/25 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.9)] backdrop-blur-2xl max-w-xs w-full mx-4 text-center">
            
            <!-- Elemento 3D App: Imagem com Flutuação -->
            <div class="relative w-32 h-32 mb-3 flex items-center justify-center animate-float-3d">
                <div class="absolute inset-0 bg-blue-600/25 rounded-full blur-xl"></div>
                <div class="w-full h-full rounded-2xl bg-gradient-to-br from-blue-500/15 via-slate-800/50 to-emerald-500/15 border border-white/10 flex items-center justify-center p-2 shadow-[inset_0_2px_6px_rgba(255,255,255,0.1)] relative z-10 overflow-hidden">
                    <img src="https://raw.githubusercontent.com/claudiogames/Novo-sistema-carregamento/refs/heads/main/1794841948561.jpg" alt="Operação Grendene" class="w-full h-full object-cover rounded-xl drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]">
                </div>
            </div>
            
            <h1 class="text-white text-sm font-extrabold tracking-wider uppercase mb-1 drop-shadow">
                Portão 1 CD
            </h1>
            <p class="text-[10px] text-emerald-400 font-semibold mb-4 tracking-wide uppercase">✨ Boas festas Grendene ✨</p>
            
            <!-- Barra de Progresso Rápida -->
            <div class="w-full bg-slate-950/80 rounded-full h-1.5 overflow-hidden border border-slate-800 p-0.5 shadow-inner">
                <div id="splash-progress" class="bg-gradient-to-r from-blue-500 via-emerald-400 to-cyan-400 h-full w-0 rounded-full transition-all duration-[1000ms] ease-out"></div>
            </div>
        </div>
    </div>

    <!-- MODAL DE AVISOS / CAMPANHAS (SLIDE) -->
    <div id="campaign-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[99999] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-900 border border-bordercol rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col transform scale-95 transition-transform duration-300" id="campaign-content">
            <!-- Cabeçalho do Modal -->
            <div class="bg-slate-950 px-4 py-3 border-b border-bordercol flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i data-lucide="megaphone" class="w-4 h-4 text-cyan-400"></i>
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-200">Avisos & Campanhas • Portão 1 CD</span>
                </div>
                <button onclick="fecharModalCampanhas()" class="text-slate-400 hover:text-white p-1 rounded transition cursor-pointer" title="Fechar">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <!-- Corpo do Slide / Carousel -->
            <div class="relative w-full h-[380px] bg-slate-950 flex items-center justify-center overflow-hidden">
                <div id="slide-track" class="flex w-full h-full transition-transform duration-500 ease-in-out">
                    <!-- Slide 1 (Campanha Natal sem Fome) -->
                    <div class="min-w-full h-full flex items-center justify-center p-3">
                        <img src="https://raw.githubusercontent.com/claudiogames/Novo-sistema-carregamento/refs/heads/main/2611_-_Natal_sem_Fome%20(1).jpg" alt="Natal sem Fome" class="w-full h-full object-contain rounded-lg shadow-md">
                    </div>
                    <!-- Slide 2 (Campanha Grendene) -->
                    <div class="min-w-full h-full flex items-center justify-center p-3">
                        <img src="https://raw.githubusercontent.com/claudiogames/Novo-sistema-carregamento/refs/heads/main/IMG-20261111-WA0000.jpg" alt="Campanha Grendene" class="w-full h-full object-contain rounded-lg shadow-md">
                    </div>
                </div>
                <!-- Botões de Navegação do Slide -->
                <button onclick="mudarSlide(-1)" class="absolute left-3 bg-black/60 hover:bg-black/90 text-white p-2 rounded-full transition cursor-pointer z-10 shadow border border-white/10" title="Anterior">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <button onclick="mudarSlide(1)" class="absolute right-3 bg-black/60 hover:bg-black/90 text-white p-2 rounded-full transition cursor-pointer z-10 shadow border border-white/10" title="Próximo">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>
            <!-- Rodapé com indicadores e fechar -->
            <div class="bg-slate-950 px-4 py-3 border-t border-bordercol flex items-center justify-between">
                <div class="flex space-x-2" id="slide-indicators">
                    <button onclick="irParaSlide(0)" class="w-2.5 h-2.5 rounded-full bg-blue-500 transition cursor-pointer indicator-dot"></button>
                    <button onclick="irParaSlide(1)" class="w-2.5 h-2.5 rounded-full bg-slate-700 transition cursor-pointer indicator-dot"></button>
                </div>
                <button onclick="fecharModalCampanhas()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded transition cursor-pointer shadow-sm">
                    Entendido / Fechar
                </button>
            </div>
        </div>
    </div>

    <!-- CABEÇALHO AZUL PROFISSIONAL -->
    <header class="bg-blue-600 border-b border-blue-500 px-4 py-2 flex items-center justify-between shadow-lg shrink-0">
        
        <!-- Identidade -->
        <div class="flex items-center space-x-2.5">
            <img src="https://pub-f46b0cda8b8d434aabcf14ccac85f3af.r2.dev/1791682069820.png" alt="Grendene" class="w-6 h-6 object-contain rounded bg-white p-0.5 shadow-sm">
            <span class="text-xs font-bold tracking-wider uppercase text-white">Grendene</span>
            <span class="text-blue-200">/</span>
            <span class="text-xs font-semibold text-blue-100">Portão 1 CD</span>
        </div>
        
        <!-- Navegação em Abas (Estilo Limpo) -->
        <nav class="flex items-center space-x-1 overflow-x-auto max-w-[70vw] sm:max-w-none px-2">
            <button onclick="switchApp('ocorrencias', this)" id="btn-ocorrencias" class="nav-btn px-3 py-1.5 bg-white text-blue-700 text-xs font-bold rounded transition flex items-center space-x-1.5 shrink-0 shadow-sm">
                <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i>
                <span>Ocorrências</span>
            </button>
            <button onclick="switchApp('carregamento', this)" id="btn-carregamento" class="nav-btn px-3 py-1.5 bg-blue-700/60 hover:bg-blue-700 text-blue-100 hover:text-white text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-blue-400">
                <i data-lucide="truck" class="w-3.5 h-3.5"></i>
                <span>Carregamento</span>
            </button>
            <button onclick="switchApp('caixas-misturadas', this)" id="btn-caixas-misturadas" class="nav-btn px-3 py-1.5 bg-blue-700/60 hover:bg-blue-700 text-blue-100 hover:text-white text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-blue-400">
                <i data-lucide="box" class="w-3.5 h-3.5"></i>
                <span>Caixas Misturadas</span>
            </button>
            <button onclick="switchApp('sem-externas', this)" id="btn-sem-externas" class="nav-btn px-3 py-1.5 bg-blue-700/60 hover:bg-blue-700 text-blue-100 hover:text-white text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-blue-400">
                <i data-lucide="tag" class="w-3.5 h-3.5"></i>
                <span>Sem Externas</span>
            </button>
            <button onclick="switchApp('rastreio', this)" id="btn-rastreio" class="nav-btn px-3 py-1.5 bg-blue-700/60 hover:bg-blue-700 text-blue-100 hover:text-white text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-blue-400">
                <i data-lucide="package" class="w-3.5 h-3.5"></i>
                <span>Rastreio SSCC</span>
            </button>
            <button onclick="switchApp('etiquetas', this)" id="btn-etiquetas" class="nav-btn px-3 py-1.5 bg-blue-700/60 hover:bg-blue-700 text-blue-100 hover:text-white text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-blue-400">
                <i data-lucide="barcode" class="w-3.5 h-3.5"></i>
                <span>Etiquetas</span>
            </button>
            <button onclick="switchApp('requisicao', this)" id="btn-requisicao" class="nav-btn px-3 py-1.5 bg-blue-700/60 hover:bg-blue-700 text-blue-100 hover:text-white text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-blue-400">
                <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                <span>Requisição</span>
            </button>
        </nav>

        <div class="w-6"></div>
    </header>

    <!-- CONTAINER DE APLICAÇÕES -->
    <main class="flex-1 w-full relative bg-darkbg flex flex-col" id="mainContainer">
        <iframe id="frame-ocorrencias" src="https://ocportao1.vercel.app/" class="app-frame active" title="Ocorrências"></iframe>
        <iframe id="frame-carregamento" src="https://controle-carregamento.vercel.app/" class="app-frame" title="Carregamento"></iframe>
        <iframe id="frame-caixas-misturadas" src="https://caixas-misturadas.vercel.app/" class="app-frame" title="Caixas Misturadas"></iframe>
        <iframe id="frame-sem-externas" src="https://fxcxgrnd3.netlify.app/" class="app-frame" title="Sem Externas"></iframe>
        <iframe id="frame-rastreio" src="https://repogrnd.netlify.app/" class="app-frame" title="Rastreio SSCC"></iframe>
        <iframe id="frame-etiquetas" src="https://controledeetiquetas.vercel.app/" class="app-frame" title="Etiquetas"></iframe>
        <iframe id="frame-requisicao" src="https://sisgrnd.netlify.app/" class="app-frame" title="Requisição"></iframe>
    </main>

    <!-- TOAST NOTIFICATIONS CONTAINER -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- SCRIPTS -->
    <script>
        lucide.createIcons();

        // Somzinho rápido de natal seguro
        function tocarSomNatalino() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const notas = [523.25, 659.25, 783.99];
                notas.forEach((freq, index) => {
                    setTimeout(() => {
                        if (ctx.state === 'suspended') ctx.resume();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime);
                        gain.gain.setValueAtTime(0.08, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.3);
                    }, index * 100);
                });
            } catch (e) {}
        }

        function fecharSplashAutomatico() {
            const splash = document.getElementById('christmas-splash');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.remove();
                    abrirModalCampanhas();
                }, 400);
            }
        }

        // Inicialização automática garantida
        window.addEventListener('DOMContentLoaded', () => {
            tocarSomNatalino();

            const prog = document.getElementById('splash-progress');
            if (prog) prog.style.width = '100%';

            const snowContainer = document.getElementById('snow-container');
            if (snowContainer) {
                for (let i = 0; i < 15; i++) {
                    const flake = document.createElement('div');
                    flake.className = 'absolute bg-white rounded-full opacity-60 animate-fall';
                    const size = Math.random() * 2 + 1;
                    flake.style.width = `${size}px`;
                    flake.style.height = `${size}px`;
                    flake.style.left = `${Math.random() * 100}%`;
                    flake.style.top = `-${Math.random() * 20}%`;
                    flake.style.animationDuration = `${Math.random() * 2 + 1.5}s`;
                    snowContainer.appendChild(flake);
                }
            }

            // Transição automática para o app e modal de avisos após 1.1 segundos
            setTimeout(() => {
                fecharSplashAutomatico();
            }, 1100);
        });

        // Controle do Slide / Carousel de Campanhas
        let currentSlide = 0;
        const totalSlides = 2;

        function mudarSlide(direcao) {
            currentSlide = (currentSlide + direcao + totalSlides) % totalSlides;
            atualizarSlide();
        }

        function irParaSlide(index) {
            currentSlide = index;
            atualizarSlide();
        }

        function atualizarSlide() {
            const track = document.getElementById('slide-track');
            if (track) {
                track.style.transform = `translateX(-${currentSlide * 100}%)`;
            }
            const dots = document.querySelectorAll('.indicator-dot');
            dots.forEach((dot, idx) => {
                if (idx === currentSlide) {
                    dot.className = "w-2.5 h-2.5 rounded-full bg-blue-500 transition cursor-pointer indicator-dot";
                } else {
                    dot.className = "w-2.5 h-2.5 rounded-full bg-slate-700 transition cursor-pointer indicator-dot";
                }
            });
        }

        function abrirModalCampanhas() {
            const modal = document.getElementById('campaign-modal');
            const content = document.getElementById('campaign-content');
            if (modal && content) {
                modal.classList.remove('pointer-events-none');
                modal.style.opacity = '1';
                content.style.transform = 'scale(1)';
            }
        }

        function fecharModalCampanhas() {
            const modal = document.getElementById('campaign-modal');
            const content = document.getElementById('campaign-content');
            if (modal && content) {
                modal.style.opacity = '0';
                content.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    modal.classList.add('pointer-events-none');
                }, 300);
            }
        }

        let currentAppId = 'ocorrencias';

        function switchApp(appId, btnElement) {
            currentAppId = appId;

            document.querySelectorAll('.app-frame').forEach(frame => {
                frame.classList.remove('active');
            });

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn px-3 py-1.5 bg-blue-700/60 hover:bg-blue-700 text-blue-100 hover:text-white text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-blue-400";
            });

            const targetFrame = document.getElementById(`frame-${appId}`);
            if (targetFrame) {
                targetFrame.classList.add('active');
            }

            const targetBtn = btnElement || document.getElementById(`btn-${appId}`);
            if (targetBtn) {
                targetBtn.className = "nav-btn px-3 py-1.5 bg-white text-blue-700 text-xs font-bold rounded transition flex items-center space-x-1.5 shrink-0 shadow-sm";
            }
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'notify') {
                mostrarToast(event.data.message, event.data.status || 'success');
            }
        });

        function mostrarToast(mensagem, tipo = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            
            const toast = document.createElement('div');
            toast.className = `toast-animate pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-lg border shadow-xl text-xs font-medium backdrop-blur-md transition-all ${
                tipo === 'success' 
                    ? 'bg-slate-900/90 border-emerald-500/50 text-emerald-300' 
                    : tipo === 'warning'
                    ? 'bg-slate-900/90 border-amber-500/50 text-amber-300'
                    : 'bg-slate-900/90 border-cyan-500/50 text-cyan-300'
            }`;

            const icone = tipo === 'success' ? 'check-circle' : tipo === 'warning' ? 'alert-triangle' : 'info';
            
            toast.innerHTML = `
                <i data-lucide="${icone}" class="w-4 h-4 shrink-0"></i>
                <span>${mensagem}</span>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease-in';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
