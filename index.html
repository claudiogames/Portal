<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portão 1 CD • Central Operacional</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#111827',
                        bordercol: '#1f2937'
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .app-frame {
            width: 100%;
            height: calc(100vh - 65px);
            border: none;
            display: none;
        }
        .app-frame.active {
            display: block;
        }
        ::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 2px;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-animate {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-hidden">

    <!-- CABEÇALHO COM ÍCONE DA GRENDENE -->
    <header class="bg-cardbg border-b border-bordercol px-4 py-2 flex items-center justify-between shadow-lg shrink-0">
        
        <!-- Identidade com Ícone Real -->
        <div class="flex items-center space-x-2.5">
            <!-- Ícone da Grendene Redimensionado -->
            <img src="https://pub-f46b0cda8b8d434aabcf14ccac85f3af.r2.dev/1791682069820.png" alt="Grendene" class="w-6 h-6 object-contain rounded">
            <span class="text-xs font-bold tracking-wider uppercase text-slate-200">Grendene</span>
            <span class="text-slate-600">/</span>
            <span class="text-xs font-semibold text-slate-400">Portão 1 CD</span>
        </div>
        
        <!-- Navegação em Abas Discretas (Iniciando em Ocorrências) -->
        <nav class="flex items-center space-x-1 overflow-x-auto max-w-[65vw] sm:max-w-none px-2">
            <button onclick="switchApp('ocorrencias', this)" id="btn-ocorrencias" class="nav-btn px-3 py-1.5 bg-blue-600 text-slate-100 text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 shadow-sm shadow-blue-900/50">
                <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i>
                <span>Ocorrências</span>
            </button>
            <button onclick="switchApp('carregamento', this)" id="btn-carregamento" class="nav-btn px-3 py-1.5 bg-slate-900/60 hover:bg-slate-800 text-slate-400 hover:text-slate-200 text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-bordercol">
                <i data-lucide="truck" class="w-3.5 h-3.5"></i>
                <span>Carregamento</span>
            </button>
            <button onclick="switchApp('sem-externas', this)" id="btn-sem-externas" class="nav-btn px-3 py-1.5 bg-slate-900/60 hover:bg-slate-800 text-slate-400 hover:text-slate-200 text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-bordercol">
                <i data-lucide="tag" class="w-3.5 h-3.5"></i>
                <span>Sem Externas</span>
            </button>
            <button onclick="switchApp('rastreio', this)" id="btn-rastreio" class="nav-btn px-3 py-1.5 bg-slate-900/60 hover:bg-slate-800 text-slate-400 hover:text-slate-200 text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-bordercol">
                <i data-lucide="box" class="w-3.5 h-3.5"></i>
                <span>Rastreio SSCC</span>
            </button>
            <button onclick="switchApp('etiquetas', this)" id="btn-etiquetas" class="nav-btn px-3 py-1.5 bg-slate-900/60 hover:bg-slate-800 text-slate-400 hover:text-slate-200 text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-bordercol">
                <i data-lucide="barcode" class="w-3.5 h-3.5"></i>
                <span>Etiquetas</span>
            </button>
            <button onclick="switchApp('requisicao', this)" id="btn-requisicao" class="nav-btn px-3 py-1.5 bg-slate-900/60 hover:bg-slate-800 text-slate-400 hover:text-slate-200 text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-bordercol">
                <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                <span>Requisição</span>
            </button>
        </nav>

        <!-- Atalhos discretos -->
        <div class="hidden lg:flex items-center text-[10px] text-slate-500 font-mono bg-slate-900 px-2 py-1 rounded border border-bordercol">
            💡 2 cliques: Tela Cheia | 3 cliques: Recarregar
        </div>

    </header>

    <!-- CONTAINER DE IFRAMES -->
    <main class="flex-1 w-full relative bg-darkbg" id="mainContainer">
        <iframe id="frame-ocorrencias" src="https://ocportao1.vercel.app/" class="app-frame active" title="Ocorrências"></iframe>
        <iframe id="frame-carregamento" src="https://controle-carregamento.vercel.app/" class="app-frame" title="Carregamento"></iframe>
        <iframe id="frame-sem-externas" src="https://fxcxgrnd3.netlify.app/" class="app-frame" title="Sem Externas"></iframe>
        <iframe id="frame-rastreio" src="https://repogrnd.netlify.app/" class="app-frame" title="Rastreio SSCC"></iframe>
        <iframe id="frame-etiquetas" src="https://controledeetiquetas.vercel.app/" class="app-frame" title="Etiquetas"></iframe>
        <iframe id="frame-requisicao" src="https://sisgrnd.netlify.app/" class="app-frame" title="Requisição"></iframe>
    </main>

    <!-- TOAST NOTIFICATIONS CONTAINER -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- SCRIPTS -->
    <script>
        lucide.createIcons();

        let currentAppId = 'ocorrencias';

        function switchApp(appId, btnElement) {
            currentAppId = appId;

            document.querySelectorAll('.app-frame').forEach(frame => {
                frame.classList.remove('active');
            });

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn px-3 py-1.5 bg-slate-900/60 hover:bg-slate-800 text-slate-400 hover:text-slate-200 text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 border border-transparent hover:border-bordercol";
            });

            const targetFrame = document.getElementById(`frame-${appId}`);
            if (targetFrame) {
                targetFrame.classList.add('active');
            }

            const targetBtn = btnElement || document.getElementById(`btn-${appId}`);
            if (targetBtn) {
                targetBtn.className = "nav-btn px-3 py-1.5 bg-blue-600 text-slate-100 text-xs font-medium rounded transition flex items-center space-x-1.5 shrink-0 shadow-sm shadow-blue-900/50";
            }
        }

        function reloadActiveApp() {
            const activeFrame = document.getElementById(`frame-${currentAppId}`);
            if (activeFrame) {
                activeFrame.src = activeFrame.src;
            }
            mostrarToast("Aba atual recarregada.", "info");
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.error(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        let clickCount = 0;
        let clickTimer = null;

        document.querySelector('header').addEventListener('click', (e) => {
            if (e.target.closest('button')) return;

            clickCount++;
            
            if (clickCount === 1) {
                clickTimer = setTimeout(() => { clickCount = 0; }, 400);
            } else if (clickCount === 2) {
                clearTimeout(clickTimer);
                clickCount = 0;
                toggleFullscreen();
            } else if (clickCount >= 3) {
                clearTimeout(clickTimer);
                clickCount = 0;
                reloadActiveApp();
            }
        });

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'notify') {
                mostrarToast(event.data.message, event.data.status || 'success');
            }
        });

        function mostrarToast(mensagem, tipo = 'success') {
            const container = document.getElementById('toastContainer');
            
            const toast = document.createElement('div');
            toast.className = `toast-animate pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-lg border shadow-xl text-xs font-medium backdrop-blur-md transition-all ${
                tipo === 'success' 
                    ? 'bg-slate-900/90 border-emerald-500/50 text-emerald-300' 
                    : tipo === 'warning'
                    ? 'bg-slate-900/90 border-amber-500/50 text-amber-300'
                    : 'bg-slate-900/90 border-blue-500/50 text-blue-300'
            }`;

            const icone = tipo === 'success' ? 'check-circle' : tipo === 'warning' ? 'alert-triangle' : 'info';
            
            toast.innerHTML = `
                <i data-lucide="${icone}" class="w-4 h-4 shrink-0"></i>
                <span>${mensagem}</span>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease-in';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
